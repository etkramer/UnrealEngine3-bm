+DebugLevelStarts=(Name="FE_ExitGame", LevelNames="exit")
+DebugLevelStarts=(Name="FE_Benchmark", LevelNames="start batentry?Area=benchmark,Max_A1,Max_A1_Static,Max_A1_PhysX,Max_A1_Lights,Max_A1_Fx,Max_A1_CH1,Max_A1_Audio,Max_A1_CLights?DisableFrameSmoothing?Causeevent=PlayCam")

