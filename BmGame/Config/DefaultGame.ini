[Configuration]
BasedOn=..\Engine\Config\BaseGame.ini

[Engine.GameInfo]
DefaultGame=BmGame.RGameInfo
DefaultServerGame=BmGame.RGameInfo
MaxPlayers=1
MaxSpectators=0

[Engine.WorldInfo]
DefaultGravityZ=-1000.0
RBPhysicsGravityScaling=1.5

[DefaultPlayer]
Name=Player
team=255

;	ERG - AM All the game areas - Admin, Cave, Cell...
[AreaNamesList]
AreaNames	= "Admin"
+AreaNames	= "Cave"
+AreaNames	= "Cell"
+AreaNames	= "Garden"
+AreaNames	= "Max"
+AreaNames	= "Medical"
+AreaNames	= "Overworld"
+AreaNames	= "Visitor"


;   ERG - TC allow different bink in america
[AlternativeRegionMovie]
RegionUS=LegalUS

[Engine.Pawn]
VehicleCheckRadius=1000

[BmGame.RPlayerController]
ButtonCover=true

DebugLevelStarts=(Name="FE_NewGame", LevelNames="start batentry?Area=Max,Max_C0,Max_C0_Audio,Max_C0_CLights,Max_C0_FX,Max_C0_Lights,Max_C0_Static,Max_A1,Max_A1_Audio,Max_A1_CH1,Max_A1_CLights,Max_A1_Fx,Max_A1_Lights,Max_A1_Static,Max_IntroParty,Max_IntroAudio?Flags=Chapter1_Start,gamestart,Batman_AbilitiesScreenDisabled,Batman_EnvAnalysisDisabled,Batman_RiddlesDisabled,Batman_RiddlerChallengesDisabled?Start=BeginGame?Movie=101_Batmobile_Intro?StreamMovie")
